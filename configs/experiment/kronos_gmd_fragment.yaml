# @package _global_
# Train default KRONOS on the GMD FragmentDuplication task.
#
# Usage:
#   pixi run train experiment=kronos_gmd_fragment
#
# In-distribution validation uses TestID; out-of-distribution evaluation
# uses TestOOD (Lightning's ``trainer.test`` is run after training when
# ``test: true`` in train.yaml, which is the default).

defaults:
  - override /data: gmd_fragment_duplication
  - override /model: kronos
  - override /model/kronos/elements: hco

tags: ["kronos", "gmd", "fragment_duplication"]

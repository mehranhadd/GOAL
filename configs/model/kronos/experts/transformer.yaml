# @package model.backbone.expert_config
# E(3)-safe Transformer expert.
#
# Operates on the *invariant scalar* track only: each pair's feature
# vector is treated as a sequence of three tokens
# ``[scalars_A, scalars_B, distance_embedding]``.  Because the inputs
# are invariants, the entire transformer encoder is automatically
# invariant under rotations / translations and the overall E(3) symmetry
# of the model is preserved.

scalar_channels: 16

# First entry of ``hidden_dims`` is the transformer's ``d_model``.  Last
# entry is used as the feed-forward dimension.
hidden_dims: [64, 64]

expert_type: transformer
transformer_heads: 4
transformer_layers: 2

# @package model.head
# Hybrid forces:
#
#     F = -grad(E, r)  +  correction_weight * F_direct
#
# The autograd term is the **leading** contribution; the direct head
# acts as a small correction to absorb systematic residuals.  Keep
# ``correction_weight`` low (e.g. 0.05) so the model stays close to
# energy-conserving.

mode: hybrid
correction_weight: 0.05

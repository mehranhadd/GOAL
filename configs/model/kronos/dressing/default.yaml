# @package model.backbone.dressing_kwargs
# KRONOS environment-dressing block — one (or more) ACE-style rounds of
# E(3) message passing over the local neighbourhood, optionally followed
# by an ACE body-order expansion (B²/B³).
#
# ``num_elements`` is set by the ``elements`` group.

embedding_dim: 128

# Equivariant hidden width and maximum spherical-harmonic order.
hidden_channels: 128
lmax: 2

# Bessel radial expansion fed into the radial MLP.
num_radial_basis: 8
radial_mlp_hidden: 128

# Cosine cutoff radius (Angstrom) — shared between radial basis,
# polynomial envelope, and the pairwise expert cutoff below.
cutoff: 8.0

# Number of ACE-style message-passing rounds producing the one-particle
# basis A_i.
num_message_passing: 1

# ACE body-order parameter.  Geometric interpretation:
#   1 → output is A_i             (3-body via the MP tensor product)
#   2 → output is B² = A ⊗_CG A   (captures bond angles, 4-body)
#   3 → output is B³ = B² ⊗_CG A  (captures dihedrals, 5-body)
# Output irreps are derived programmatically from the CG decomposition
# and compressed back to ``hidden_channels × irreps`` so the expert
# interface is unchanged regardless of body order.
body_order: 1

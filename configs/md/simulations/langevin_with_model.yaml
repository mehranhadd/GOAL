# Full simulation: molecule + trained model + MD
defaults:
  - /md/molecules/ethanol
  - /md/calculators/goal_model
  - /md/dynamics/langevin

# MD simulation parameters
num_steps: 1000
output_file: trajectory.traj
log_file: md.log
log_interval: 10

# Model checkpoint
calculators:
  checkpoint: null # Set from CLI: goal-md -c simulations/langevin_with_model calculators.checkpoint=path/to/model.ckpt

# Molecule (set from CLI if needed)
# molecules:
#   smiles: CCO

# @package data
# GMD — FragmentDuplication task.
#
# Directory-based per-split loading (DataModule Mode 4):
#   Training/ → train
#   TestID/   → val   (in-distribution)
#   TestOOD/  → test  (out-of-distribution)
#
# Each directory contains one ``.traj`` file per molecular formula
# (O2CnH2n for training, O4CnH2n-2 for the test sets).  Every file
# in a directory is discovered automatically and concatenated.
#
# Usage:
#   goal-train data=gmd_fragment_duplication

dataset_type: trajectory
cutoff: 8.0

# Directory-based per-split loading
train_dir: ${paths.root_dir}/data/GMD/FragmentDuplication/Training
val_dir: ${paths.root_dir}/data/GMD/FragmentDuplication/TestID
test_dir: ${paths.root_dir}/data/GMD/FragmentDuplication/TestOOD

# ``root`` is unused for Mode 4 but the DataModule still reads the
# field — point it at the dataset root so logs are tidy.
root: ${paths.root_dir}/data/GMD/FragmentDuplication

# DataLoader
batch_size: 6
num_workers: 0
pin_memory: true
persistent_workers: false
prefetch_factor: 2

# ASE trajectory-specific dataset kwargs.  The loader falls back to
# ``atoms.get_potential_energy()`` / ``atoms.get_forces()`` when the
# corresponding info / arrays keys are missing — which is the case
# for these PBE trajectories.
energy_key: energy
forces_key: forces

# When concatenating multiple files inside a single split, walk them
# in alphabetical order.  ``random`` would shuffle once at load time;
# the per-batch shuffle inside the DataLoader still happens either
# way during training.
merge_strategy: sequential
split_seed: 97
